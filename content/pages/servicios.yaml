faq:
  eyebrow: Preguntas
  title: Preguntas frecuentes
  items:
    - q: ¿Cuánto tarda un proyecto?
      a: Una landing suele estar lista en 1–2 semanas y un sitio completo en 3–5. Las aplicaciones a medida se planifican por etapas.
    - q: ¿Qué necesito para empezar?
      a: Solo contarme tu idea. Si tenés logo, textos o referencias ayudan, pero puedo guiarte en lo que falte.
    - q: ¿Cómo se paga?
      a: Habitualmente 50% al comenzar y 50% al entregar. En proyectos grandes se divide por etapas.
    - q: ¿Puedo editar el contenido yo mismo?
      a: Sí. Te dejo el sitio listo para que actualices textos, imágenes y entradas del blog sin depender de nadie.
