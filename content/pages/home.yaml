meaning:
  eyebrow: 01 / el nombre
  title: |-
    **Omni** significa todo.
    Por eso me ocupo de todo.
  text: >-
    Un proyecto de software se rompe en las costuras entre el diseñador, el
    programador y quien lo publica. Acá no hay costuras.
  principles:
    - title: Una sola cabeza
      text: >-
        Hablás con quien escribe el código. Sin intermediarios ni mensajes
        perdidos.
    - title: Del boceto al deploy
      text: Diseño, desarrollo, publicación y mantenimiento en el mismo lugar.
    - title: Todo es tuyo
      text: Repositorio, dominio y cuentas a tu nombre desde el primer día.
